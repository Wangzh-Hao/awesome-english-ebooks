name: Send latest magazines to Kindle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 5"

jobs:
  send:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        magazine:
          - name: Economist
            path: 01_economist
          - name: New Yorker
            path: 02_new_yorker
          - name: Atlantic
            path: 04_atlantic
          - name: Wired
            path: 05_wired

    steps:
      - name: Find latest EPUB
        id: latest
        run: |
          git clone --depth=1 \
            https://github.com/hehonghui/awesome-english-ebooks.git upstream

          file=$(find "upstream/${{ matrix.magazine.path }}" \
            -type f -iname "*.epub" \
            -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$file" ]; then
            echo "没有找到 EPUB：${{ matrix.magazine.name }}"
            exit 1
          fi

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "找到：$file"

      - name: Send to Kindle
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USERNAME }}
          to: ${{ secrets.KINDLE_EMAIL }}
          subject: "[Kindle] ${{ matrix.magazine.name }}"
          body: "Latest EPUB: ${{ matrix.magazine.name }}"
          attachments: ${{ steps.latest.outputs.file }}
